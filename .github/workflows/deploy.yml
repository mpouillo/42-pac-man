name: Build and deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip curl

      - name: Build package
        run: make dist

      - name: Download and Setup Butler
        run: |
          mkdir -p ./tools
          curl -sSLfo ./tools/butler.zip "https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default"
          cd tools
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Publish to Itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          ./tools/butler push ./dist/pac-man.zip mpouillo/pac-man:linux
